<script>
(function(){
  // Mobile menu
  var btn = document.getElementById('menuBtn');
  var nav = document.getElementById('mobileNav');
  if(btn && nav){
    btn.addEventListener('click', function(){
      var open = document.body.classList.toggle('menu-open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    nav.addEventListener('click', function(e){
      if(e.target.tagName === 'A' || e.target === nav){
        document.body.classList.remove('menu-open');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
  }

  // Bottom bar active state
  var items = document.querySelectorAll('.bottom-bar .bottom-item');
  var path = location.pathname.split('/').pop() || 'index.html';
  items.forEach(function(a){
    if(a.getAttribute('href') === path) a.classList.add('active');
  });

  // Video modal
  var modal = document.getElementById('videoModal');
  var modalVideo = document.getElementById('modalVideo');
  var modalTitle = document.getElementById('modalTitle');
  var modalClose = document.getElementById('modalClose');

  document.querySelectorAll('.tile[data-video]').forEach(function(tile){
    tile.addEventListener('click', function(e){
      e.preventDefault();
      var src = this.getAttribute('data-video');
      var title = this.getAttribute('data-title') || '';
      modalVideo.src = src;
      modalTitle.textContent = title;
      modal.classList.add('active');
      modalVideo.play();
    });
  });

  function closeModal(){
    modal.classList.remove('active');
    modalVideo.pause();
    modalVideo.src = '';
  }

  if(modalClose) modalClose.addEventListener('click', closeModal);
  if(modal) modal.addEventListener('click', function(e){
    if(e.target === modal) closeModal();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && modal.classList.contains('active')) closeModal();
  });

  // Scroll animations
  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

  document.querySelectorAll('.fade-in').forEach(function(el){
    observer.observe(el);
  });
})();
</script>
